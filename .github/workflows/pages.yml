# SPDX-License-Identifier: MIT
# The site at sciaro.verkodo.org: every .vk file rendered by `verkodo render` – a home page, one article per module,
# one page per path, search, a calculator for every norm – with Lean's verdict on it (`--prove`, Mathlib from its
# cache). verkodo comes from crates.io in the version named below, built once and kept in the cache it shares with CI.
# Published with GitHub Actions on every change on main; on a pull request only built. Actions are pinned by commit,
# with the version as a comment.
name: Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# One publication at a time; a newer one replaces one that waits.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

env:
  VERKODO_VERSION: 0.6.0
  RUST_VERSION: 1.99.1

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: github.event_name != 'pull_request'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - id: cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/verkodo
          key: verkodo-${{ env.VERKODO_VERSION }}-${{ runner.os }}
      - if: steps.cache.outputs.cache-hit != 'true'
        name: verkodo from crates.io
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal
          cargo +"$RUST_VERSION" install verkodo --version "$VERKODO_VERSION" --locked
      - uses: leanprover/lean-action@24581d74d674803a25a81b10b059c5c0cdd344c6 # v1.6.2
        with:
          lake-package-directory: lean
          auto-config: false
          build: false
          test: false
          lint: false
          use-mathlib-cache: true
      - name: The site, with Lean's verdict
        run: verkodo render . -o _site --title sciaro --prove --lean lean
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
