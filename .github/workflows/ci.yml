# SPDX-License-Identifier: MIT
# The licence check (REUSE) and a sign-off (DCO) on every commit of a pull request – both from falkoss/starterpack,
# pinned by commit – verkodo's check of every .vk file, and Lean's: definitions, bridges, theorems and examples, with
# Mathlib from its cache (lean/, pinned like verkodo's). verkodo comes from crates.io in the version named below.
# Actions are pinned by commit, with the version as a comment.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  VERKODO_VERSION: 0.3.0
  RUST_VERSION: 1.99.1

jobs:
  licences:
    uses: falkoss/starterpack/.github/workflows/reuse.yml@2c52b61993152e0f7f3828a628869f1aef62f0f3
  sign-off:
    uses: falkoss/starterpack/.github/workflows/dco.yml@2c52b61993152e0f7f3828a628869f1aef62f0f3
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # verkodo, built once per version and kept in the cache.
      - id: cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/verkodo
          key: verkodo-${{ env.VERKODO_VERSION }}-${{ runner.os }}
      - if: steps.cache.outputs.cache-hit != 'true'
        name: verkodo from crates.io
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal
          cargo +"$RUST_VERSION" install verkodo --version "$VERKODO_VERSION" --locked
      - name: Parse, resolve and check every .vk file
        run: verkodo check .
  lean:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/verkodo
          key: verkodo-${{ env.VERKODO_VERSION }}-${{ runner.os }}
          fail-on-cache-miss: true
      # Lean and Mathlib's build from its cache – nothing of sciaro is built by lake itself.
      - uses: leanprover/lean-action@24581d74d674803a25a81b10b059c5c0cdd344c6 # v1.6.2
        with:
          lake-package-directory: lean
          auto-config: false
          build: false
          test: false
          lint: false
          use-mathlib-cache: true
      - name: Lean checks every .vk file
        run: verkodo prove . --lean lean
  # Results against official tables (tests/*.py) need `verkodo eval`, which comes after 0.3.0: verkodo from this
  # commit of its repository until the next version is on crates.io.
  tables:
    runs-on: ubuntu-latest
    env:
      VERKODO_REV: 428c262afb29af02f48c179bfb206b4468d2b89d
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/verkodo
          key: verkodo-git-${{ env.VERKODO_REV }}-${{ runner.os }}
      - if: steps.cache.outputs.cache-hit != 'true'
        name: verkodo from its repository
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal
          cargo +"$RUST_VERSION" install verkodo --git https://github.com/verkodo/verkodo --rev "$VERKODO_REV" --locked
      - name: The wage tax 2026 against the test tables of the BMF
        run: python3 tests/lst_2026.py
